plugins { id 'com.android.application' }

android {
    namespace 'io.github.jiaowoban.dark'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.jiaowoban.dark'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'io.github.jiaowoban.dark.BrowseInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    compileOnly files('../third_party/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
}
